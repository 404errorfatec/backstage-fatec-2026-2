services:
  db:
    image: postgres:16
    container_name: pg-fatec
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: fatec
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-fatec-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fatec"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-fatec-dados:
