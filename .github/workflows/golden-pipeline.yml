name: Golden Pipeline

# Nesta seção estão as verificações que o projeto precisa passar.
# A publicação continua sendo feita pela Vercel.

on:
  # Permite que outro workflow utilize essas etapas.
  workflow_call:
    inputs::
        description: Versão do Node.js
        type: string
        default: "22"
      run-catalog-check:
        description: Verifica se o catálogo está atualizado
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validar catálogo
        if: ${{ inputs.run-catalog-check }}
        run: bash scripts/ci/check-catalog.sh

      - name: Build
        run: npm run build
